<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Sobre mí: Saray Rodríguez, estudiante de DAM en Móstoles">
  <defs>
    <clipPath id="tarjeta">
      <rect width="900" height="400" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .codigo { font-family: 'Cascadia Code','Consolas','SFMono-Regular','Menlo','Noto Sans JP',monospace; font-size: 15px; }
    .num { fill: #6b5a80; }
    .com { fill: #8a7a9f; font-style: italic; }
    .kw  { fill: #ff79c6; }
    .cls { fill: #d6a5ff; font-weight: bold; }
    .fn  { fill: #8be9fd; }
    .slf { fill: #ffb3cb; font-style: italic; }
    .atr { fill: #ffe4ee; }
    .str { fill: #a8e6cf; }
    .p   { fill: #e6dff0; }
  </style>

  <g clip-path="url(#tarjeta)">
    <rect width="900" height="400" fill="#1e1530"/>
    <!-- Barra de la ventana -->
    <rect width="900" height="44" fill="#2a1d40"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="22" r="6" fill="#febc2e"/>
    <circle cx="68" cy="22" r="6" fill="#28c840"/>
    <rect x="92" y="9" width="136" height="35" rx="6" fill="#1e1530"/>
    <text x="160" y="31" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#ffc2d6">🌸 sobre_mi.py</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="none" stroke="#ff8fb8" stroke-opacity="0.45"/>

  <g class="codigo" style="white-space:pre">
    <text x="40" y="80"  text-anchor="end" class="num">1</text>
    <text x="40" y="106" text-anchor="end" class="num">2</text>
    <text x="40" y="132" text-anchor="end" class="num">3</text>
    <text x="40" y="158" text-anchor="end" class="num">4</text>
    <text x="40" y="184" text-anchor="end" class="num">5</text>
    <text x="40" y="210" text-anchor="end" class="num">6</text>
    <text x="40" y="236" text-anchor="end" class="num">7</text>
    <text x="40" y="262" text-anchor="end" class="num">8</text>
    <text x="40" y="288" text-anchor="end" class="num">9</text>
    <text x="40" y="314" text-anchor="end" class="num">10</text>
    <text x="40" y="340" text-anchor="end" class="num">11</text>
    <text x="40" y="366" text-anchor="end" class="num">12</text>

    <text x="62" y="80"><tspan class="com"># Un poco sobre mí</tspan></text>
    <text x="62" y="106"><tspan class="kw">class</tspan><tspan class="p"> </tspan><tspan class="cls">Desarrolladora</tspan><tspan class="p">:</tspan></text>
    <text x="98" y="132"><tspan class="kw">def</tspan><tspan class="p"> </tspan><tspan class="fn">__init__</tspan><tspan class="p">(</tspan><tspan class="slf">self</tspan><tspan class="p">):</tspan></text>
    <text x="134" y="158"><tspan class="slf">self</tspan><tspan class="p">.</tspan><tspan class="atr">nombre</tspan><tspan class="p"> = </tspan><tspan class="str">"Saray Rodríguez"</tspan></text>
    <text x="134" y="184"><tspan class="slf">self</tspan><tspan class="p">.</tspan><tspan class="atr">ciudad</tspan><tspan class="p"> = </tspan><tspan class="str">"Móstoles"</tspan></text>
    <text x="134" y="210"><tspan class="slf">self</tspan><tspan class="p">.</tspan><tspan class="atr">estudios</tspan><tspan class="p"> = </tspan><tspan class="str">"DAM · 2º curso"</tspan></text>
    <text x="134" y="236"><tspan class="slf">self</tspan><tspan class="p">.</tspan><tspan class="atr">stack</tspan><tspan class="p"> = [</tspan><tspan class="str">"Python"</tspan><tspan class="p">, </tspan><tspan class="str">"Java"</tspan><tspan class="p">, </tspan><tspan class="str">"Android"</tspan><tspan class="p">, </tspan><tspan class="str">"HTML"</tspan><tspan class="p">, </tspan><tspan class="str">"Thymeleaf"</tspan><tspan class="p">]</tspan></text>
    <text x="134" y="262"><tspan class="slf">self</tspan><tspan class="p">.</tspan><tspan class="atr">intereses</tspan><tspan class="p"> = [</tspan><tspan class="str">"Desarrollo de apps"</tspan><tspan class="p">, </tspan><tspan class="str">"Inteligencia Artificial"</tspan><tspan class="p">]</tspan></text>
    <text x="134" y="288"><tspan class="slf">self</tspan><tspan class="p">.</tspan><tspan class="atr">busco</tspan><tspan class="p"> = </tspan><tspan class="str">"Prácticas de DAM"</tspan></text>
    <text x="98" y="340"><tspan class="kw">def</tspan><tspan class="p"> </tspan><tspan class="fn">saludar</tspan><tspan class="p">(</tspan><tspan class="slf">self</tspan><tspan class="p">):</tspan></text>
    <text x="134" y="366"><tspan class="fn">print</tspan><tspan class="p">(</tspan><tspan class="str">"¡Gracias por pasarte! ありがとう"</tspan><tspan class="p">)</tspan></text>
  </g>
</svg>
